apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-deployment
  labels:
    app: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-app
        image: vovhubdoc/python-app:d9efabca6359e14822a9c5cd0304498ca8b95d04
        ports:
        - containerPort: 5000
