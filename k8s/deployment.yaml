apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-deployment
  labels:
    app: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-app
        image: vovhubdoc/python-app:0cfb4374a65ca4108b95fa49a5267a3fd3b7cb0c
        ports:
        - containerPort: 5000
